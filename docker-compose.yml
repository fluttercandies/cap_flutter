# Local Cap Standalone instance for development/testing.
# Usage: docker compose up -d
# Dashboard: http://localhost:3210 (login with ADMIN_KEY below)
services:
  cap:
    image: tiago2/cap:latest
    container_name: cap
    ports:
      - "3210:3000"
    environment:
      ADMIN_KEY: dev_admin_key_change_me_in_production
      REDIS_URL: redis://valkey:6379
      # Optional: serve widget.js/WASM from this server instead of jsDelivr
      # ENABLE_ASSETS_SERVER: "true"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    container_name: cap-valkey
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  valkey-data:
