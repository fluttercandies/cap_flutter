name: cap_flutter
description: >-
  Flutter wrapper for Cap, the self-hosted proof-of-work CAPTCHA alternative.
  Flutter-native checkbox UI with a dual solver: SHA-256 challenges run in
  pure Dart, HashWX and instrumentation challenges fall back to a hidden
  WebView running the official widget.
version: 0.0.1
homepage: https://github.com/fluttercandies/cap_flutter
topics:
  - captcha
  - security
  - webview
  - proof-of-work

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

platforms:
  android:
  ios:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  flutter_inappwebview: ^6.1.5
  http: ^1.2.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
